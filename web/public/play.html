<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, user-scalable=no" />
    <title>PCSX2 Web · play</title>
    <style>
      :root { color-scheme: dark; font-family: ui-monospace, SFMono-Regular, Menlo, monospace; }
      * { box-sizing: border-box; }
      body { margin: 0; min-height: 100dvh; background: #0b0d12; color: #e8ecf4; overscroll-behavior: none; }
      main { width: min(100%, 1100px); margin: auto; padding: max(12px, env(safe-area-inset-top)) 12px max(12px, env(safe-area-inset-bottom)); }
      header { display: flex; align-items: baseline; justify-content: space-between; gap: 12px; margin-bottom: 8px; }
      h1 { margin: 0; font: 600 clamp(15px, 3vw, 22px)/1.3 inherit; }
      #status { color: #92f3b4; font-size: 12px; text-align: right; }
      .picker { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 8px 0; font-size: 12px; }
      .picker select, .picker button, .picker label { font: inherit; }
      .picker select { min-width: 220px; background: #171d29; color: #fff; border: 1px solid #526078; padding: 4px 6px; }
      .screen { position: relative; width: 100%; aspect-ratio: 4 / 3; background: #000; border: 1px solid #293142; border-radius: 8px; overflow: hidden; }
      .screen canvas { display: block; width: 100%; height: 100%; }
      #detail { min-height: 18px; margin: 7px 2px 12px; color: #9da8bb; font-size: 11px; white-space: pre-wrap; }
      .controls { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; gap: 18px; user-select: none; -webkit-user-select: none; touch-action: none; }
      .dpad { display: grid; grid-template-columns: repeat(3, minmax(42px, 64px)); grid-template-rows: repeat(3, minmax(42px, 64px)); justify-content: start; }
      .faces { position: relative; justify-self: end; width: 180px; height: 150px; }
      button { border: 1px solid #526078; background: #171d29; color: #fff; font: 600 15px inherit; touch-action: none; }
      button.pressed, button:active { background: #4968ff; border-color: #90a4ff; }
      .dpad button { border-radius: 8px; }
      [data-control="up"] { grid-column: 2; grid-row: 1; }
      [data-control="left"] { grid-column: 1; grid-row: 2; }
      [data-control="right"] { grid-column: 3; grid-row: 2; }
      [data-control="down"] { grid-column: 2; grid-row: 3; }
      .middle { display: flex; flex-direction: column; gap: 8px; }
      .middle button { border-radius: 999px; padding: 9px 15px; font-size: 11px; }
      .faces button { position: absolute; width: 58px; height: 58px; border-radius: 50%; }
      [data-control="triangle"] { left: 61px; top: 0; }
      [data-control="square"] { left: 0; top: 47px; }
      [data-control="circle"] { right: 0; top: 47px; }
      [data-control="cross"] { left: 61px; bottom: 0; }
      .keys { margin-top: 12px; color: #9da8bb; font-size: 11px; }
      #result { display: none; }
      @media (max-width: 620px) {
        main { padding-left: 8px; padding-right: 8px; }
        .controls { gap: 7px; }
        .dpad { grid-template-columns: repeat(3, 46px); grid-template-rows: repeat(3, 46px); }
        .faces { transform: scale(.78); transform-origin: right center; width: 145px; }
      }
    </style>
  </head>
  <body>
    <main>
      <header><h1>PCSX2 Wasm</h1><span id="status">idle</span></header>
      <div class="picker">
        <label>BIOS <select id="bios"></select></label>
        <label>program <select id="target"></select></label>
        <label><input id="webgpu" type="checkbox" /> WebGPU</label>
        <button id="start" type="button">start</button>
        <button id="stop" type="button">stop</button>
        <button id="export-trace" type="button" title="Copy the recorded input trace as JSON">trace</button>
      </div>
      <div class="screen" id="canvas-host"><canvas id="pcsx2-canvas" width="640" height="480" aria-label="PCSX2 output"></canvas></div>
      <div id="detail">Pick a BIOS imported on <a href="./storage.html">storage.html</a> and a program, then start. Audio needs the start click.</div>
      <section class="controls" aria-label="Touch controls">
        <div class="dpad">
          <button data-control="up" aria-label="Up">▲</button>
          <button data-control="left" aria-label="Left">◀</button>
          <button data-control="right" aria-label="Right">▶</button>
          <button data-control="down" aria-label="Down">▼</button>
        </div>
        <div class="middle">
          <button data-control="select">SELECT</button>
          <button data-control="start">START</button>
        </div>
        <div class="faces">
          <button data-control="triangle" aria-label="Triangle">△</button>
          <button data-control="square" aria-label="Square">□</button>
          <button data-control="circle" aria-label="Circle">○</button>
          <button data-control="cross" aria-label="Cross">×</button>
        </div>
      </section>
      <p class="keys">Keys: arrows d-pad · Z cross · X circle · A square · S triangle · Q/W L1/R1 · E/R L2/R2 · Enter start · Shift select · IJKL left stick · TFGH right stick · C/V L3/R3</p>
      <pre id="result"></pre>
    </main>
    <script type="module" src="./play-runtime.mjs"></script>
  </body>
</html>
