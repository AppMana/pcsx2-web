target = "gs_sprite.elf"
frames = 800
bios = true
renderer = ["sw", "webgpu"]
cpu = "interpreter"
input = ""
known_failure = false

[trace]
tty = true
cpu = true
ram_every = 100

[compare.tty]
mode = "exact"
line_filter = "^[A-Z][A-Z0-9_]*(=.*)?$"

[compare.cpu]
mode = "exact"

[compare.frames]
mode = "md5"
trigger = [500, 600]

[compare.frames.webgpu]
mode = "rmse"
# Native Dawn renders of these frames measure rmse 1.71 (500) and 0.86 (600) against the software
# renderer's PNGs; the browser build reproduces the native WebGPU pixels exactly.
max_rmse = 2.0
min_close_pixels = 0.99
trigger = [500, 600]
